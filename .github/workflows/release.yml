name: Draft release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: draft-release-${{ github.ref }}

jobs:
  tag:
    name: Verify release tag
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a version tag on main
        id: check
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The release tag must point to a commit on main."
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: tag
    uses: ./.github/workflows/ci.yml

  draft:
    name: Create draft GitHub release
    needs: [tag, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orca-wt-darwin-arm64
          path: release

      - name: Verify assets and create draft
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_COMMIT: ${{ needs.tag.outputs.commit }}
        run: |
          sha256sum -c orca-wt-darwin-arm64.tar.gz.sha256
          tag_commit=$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)
          if [[ "$tag_commit" != "$VERIFIED_COMMIT" ]]; then
            echo "::error::The release tag changed while the artifact was being built."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --generate-notes \
            --notes "See the [prebuilt install instructions](https://github.com/$GH_REPO/blob/$GITHUB_REF_NAME/README.md#install-the-prebuilt-binary)." \
            orca-wt-darwin-arm64.tar.gz orca-wt-darwin-arm64.tar.gz.sha256
