[package]
name = "orca-wt"
version = "0.1.0"
edition = "2021"
description = "Rust port of herdr-orca-worktrees' orca-wt CLI (same subcommands, same JSON on stdout)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
ureq = { version = "2", features = ["json"] }
regex = "1"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
nix = { version = "0.30", default-features = false, features = ["signal", "process", "user"] }
sha2 = "0.10"
sha1 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
